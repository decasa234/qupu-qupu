<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF2DF" />
    <meta
      name="description"
      content="Latihan matematika interaktif untuk anak SD: kebun konsep yang tumbuh setiap kali berlatih, kuis seru, dan persiapan olimpiade matematika WMI."
    />

    <!-- Open Graph — WhatsApp is the dominant share channel in Indonesia. -->
    <meta property="og:title" content="QUPU — Belajar Matematika Seru untuk Anak" />
    <meta
      property="og:description"
      content="Latihan matematika interaktif untuk anak SD: kebun konsep yang tumbuh setiap kali berlatih, kuis seru, dan persiapan olimpiade matematika WMI."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QUPU" />
    <meta property="og:locale" content="id_ID" />
    <!-- feature-ramah.png: 800x800, <600KB — WhatsApp drops larger images. -->
    <meta property="og:image" content="https://qupu.id/feature-ramah.png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QUPU — Belajar Matematika Seru untuk Anak" />
    <meta
      name="twitter:description"
      content="Latihan matematika interaktif untuk anak SD: kebun konsep yang tumbuh setiap kali berlatih, kuis seru, dan persiapan olimpiade matematika WMI."
    />
    <meta name="twitter:image" content="https://qupu.id/feature-ramah.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Video thumbnails on the catalog/member pages are served from ytimg. -->
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>QUPU — Belajar Matematika Seru untuk Anak</title>
    <!--
      Boot splash. Inlined here so it paints immediately, before the JS
      bundle downloads. App.tsx fades #qupu-splash out once React mounts.
    -->
    <style>
      #qupu-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: #fff2df;
        font-family: 'Fredoka', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s ease;
      }
      #qupu-splash.qupu-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      #qupu-splash .qupu-splash__mascot {
        width: 118px;
        height: auto;
        user-select: none;
      }
      /* Worm loader — stretching pill. */
      #qupu-splash .qupu-splash__bar {
        position: relative;
        width: 80px;
        height: 10px;
      }
      #qupu-splash .qupu-splash__bar span {
        position: absolute;
        top: 0;
        left: 0;
        width: 24px;
        height: 10px;
        border-radius: 5px;
        background: #f0853a;
        animation: qupu-worm 1.2s ease-in-out infinite alternate;
      }
      @keyframes qupu-worm {
        0% { left: 0; width: 24px; }
        50% { width: 56px; }
        100% { left: 56px; width: 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #qupu-splash .qupu-splash__bar span {
          animation: none;
        }
      }
    </style>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="qupu-splash" role="status" aria-label="Memuat QUPU">
      <img src="/hero-mascot.png" alt="" class="qupu-splash__mascot" draggable="false" />
      <div class="qupu-splash__bar" aria-hidden="true"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
