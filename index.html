<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>QUPU</title>
    <!--
      Boot splash. Inlined here so it paints immediately, before the JS
      bundle downloads. App.tsx fades #qupu-splash out once React mounts.
    -->
    <style>
      #qupu-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #fff2df;
        font-family: 'Baloo 2', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s ease;
      }
      #qupu-splash.qupu-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      #qupu-splash .qupu-splash__mascot {
        width: 140px;
        height: auto;
        user-select: none;
        animation: qupu-bob 1.5s ease-in-out infinite;
        filter: drop-shadow(0 12px 24px rgba(120, 60, 0, 0.22));
      }
      #qupu-splash .qupu-splash__text {
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: #30598a;
      }
      #qupu-splash .qupu-splash__dots {
        display: flex;
        gap: 0.5rem;
      }
      #qupu-splash .qupu-splash__dots span {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 9999px;
        background: #f0853a;
        animation: qupu-dot 1.1s ease-in-out infinite;
      }
      #qupu-splash .qupu-splash__dots span:nth-child(2) {
        animation-delay: 0.18s;
      }
      #qupu-splash .qupu-splash__dots span:nth-child(3) {
        animation-delay: 0.36s;
      }
      #qupu-splash .qupu-splash__star {
        position: absolute;
        color: #ffdd55;
        animation: qupu-twinkle 1.9s ease-in-out infinite;
      }
      @keyframes qupu-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes qupu-dot {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes qupu-twinkle {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #qupu-splash .qupu-splash__mascot,
        #qupu-splash .qupu-splash__dots span,
        #qupu-splash .qupu-splash__star {
          animation: none;
        }
      }
    </style>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="qupu-splash" role="status" aria-label="Memuat QUPU">
      <i
        class="fa-solid fa-star qupu-splash__star"
        style="top: 30%; left: 32%; font-size: 1rem"
        aria-hidden="true"
      ></i>
      <i
        class="fa-solid fa-star qupu-splash__star"
        style="top: 33%; right: 31%; font-size: 1.4rem; animation-delay: 0.5s"
        aria-hidden="true"
      ></i>
      <i
        class="fa-solid fa-star qupu-splash__star"
        style="bottom: 31%; left: 40%; font-size: 0.8rem; animation-delay: 0.9s"
        aria-hidden="true"
      ></i>
      <img
        src="/hero-mascot.png"
        alt=""
        class="qupu-splash__mascot"
        draggable="false"
      />
      <div class="qupu-splash__text">Memuat QUPU...</div>
      <div class="qupu-splash__dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
