<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph — WhatsApp is the dominant share channel in Indonesia. -->
    <meta property="og:title" content="QUPU — Belajar Matematika Seru untuk Anak" />
    <meta
      property="og:description"
      content="Latihan matematika interaktif untuk anak SD: kebun konsep yang tumbuh setiap kali berlatih, kuis seru, dan persiapan olimpiade matematika WMI."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QUPU" />
    <meta property="og:locale" content="id_ID" />
    <!-- feature-ramah.png: 800x800, <600KB — WhatsApp drops larger images. -->
    <meta property="og:image" content="https://qupu.id/feature-ramah.png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QUPU — Belajar Matematika Seru untuk Anak" />
    <meta
      name="twitter:description"
      content="Latihan matematika interaktif untuk anak SD: kebun konsep yang tumbuh setiap kali berlatih, kuis seru, dan persiapan olimpiade matematika WMI."
    />
    <meta name="twitter:image" content="https://qupu.id/feature-ramah.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>QUPU — Belajar Matematika Seru untuk Anak</title>
    <!--
      Boot splash. Inlined here so it paints immediately, before the JS
      bundle downloads. App.tsx fades #qupu-splash out once React mounts.
    -->
    <style>
      #qupu-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background:
          radial-gradient(40rem 32rem at 14% 18%, rgba(249, 115, 22, 0.13), transparent 60%),
          radial-gradient(36rem 30rem at 86% 22%, rgba(48, 89, 138, 0.13), transparent 60%),
          radial-gradient(32rem 26rem at 50% 94%, rgba(255, 211, 177, 0.55), transparent 60%),
          #fff2df;
        font-family: 'Fredoka', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s ease;
      }
      #qupu-splash.qupu-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      #qupu-splash .qupu-splash__stage {
        position: relative;
        width: 200px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #qupu-splash .qupu-splash__ring {
        position: absolute;
        inset: 4px;
        border-radius: 9999px;
        border: 4px dashed rgba(240, 133, 58, 0.5);
        animation: qupu-spin 12s linear infinite;
      }
      #qupu-splash .qupu-splash__orbit {
        position: absolute;
        inset: 4px;
        animation: qupu-spin 6s linear infinite;
      }
      #qupu-splash .qupu-splash__orbit i {
        position: absolute;
        top: -11px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffdd55;
        font-size: 1.15rem;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.14));
      }
      #qupu-splash .qupu-splash__mascot {
        position: relative;
        z-index: 1;
        width: 118px;
        height: auto;
        user-select: none;
        animation: qupu-bob 1.5s ease-in-out infinite;
        filter: drop-shadow(0 12px 22px rgba(120, 60, 0, 0.22));
      }
      #qupu-splash .qupu-splash__shadow {
        position: absolute;
        bottom: 22px;
        left: 50%;
        width: 84px;
        height: 13px;
        transform: translateX(-50%);
        border-radius: 9999px;
        background: rgba(48, 89, 138, 0.16);
        filter: blur(2px);
        animation: qupu-shadow 1.5s ease-in-out infinite;
      }
      #qupu-splash .qupu-splash__bar {
        position: relative;
        width: 176px;
        height: 8px;
        border-radius: 9999px;
        background: rgba(240, 133, 58, 0.18);
        overflow: hidden;
      }
      #qupu-splash .qupu-splash__bar span {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 42%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #ffdd55, #f0853a);
        animation: qupu-load 1.4s ease-in-out infinite;
      }
      #qupu-splash .qupu-splash__star {
        position: absolute;
        color: #ffdd55;
        animation: qupu-twinkle 1.9s ease-in-out infinite;
      }
      @keyframes qupu-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes qupu-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes qupu-shadow {
        0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.5; }
        50% { transform: translateX(-50%) scaleX(0.68); opacity: 0.3; }
      }
      @keyframes qupu-load {
        0% { left: -42%; }
        50% { left: 56%; }
        100% { left: 100%; }
      }
      @keyframes qupu-twinkle {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #qupu-splash .qupu-splash__ring,
        #qupu-splash .qupu-splash__orbit,
        #qupu-splash .qupu-splash__mascot,
        #qupu-splash .qupu-splash__shadow,
        #qupu-splash .qupu-splash__bar span,
        #qupu-splash .qupu-splash__star {
          animation: none;
        }
      }
    </style>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="qupu-splash" role="status" aria-label="Memuat QUPU">
      <i class="fa-solid fa-star qupu-splash__star" style="top: 24%; left: 30%; font-size: 1rem" aria-hidden="true"></i>
      <i class="fa-solid fa-star qupu-splash__star" style="top: 28%; right: 29%; font-size: 1.4rem; animation-delay: 0.5s" aria-hidden="true"></i>
      <i class="fa-solid fa-star qupu-splash__star" style="bottom: 26%; left: 38%; font-size: 0.8rem; animation-delay: 0.9s" aria-hidden="true"></i>
      <i class="fa-solid fa-star qupu-splash__star" style="bottom: 30%; right: 33%; font-size: 1.05rem; animation-delay: 1.3s" aria-hidden="true"></i>

      <div class="qupu-splash__stage">
        <div class="qupu-splash__ring" aria-hidden="true"></div>
        <div class="qupu-splash__orbit" aria-hidden="true"><i class="fa-solid fa-star"></i></div>
        <span class="qupu-splash__shadow" aria-hidden="true"></span>
        <img src="/hero-mascot.png" alt="" class="qupu-splash__mascot" draggable="false" />
      </div>

      <div class="qupu-splash__bar" aria-hidden="true"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
