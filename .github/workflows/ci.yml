name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      # No TEST_DATABASE_URL in CI — the Postgres integration suites skip
      # themselves by design; only the pure unit suites run here.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
